# IEC104 主站配置文件
# 该程序只采集遥信、遥测和电能累计量，不实现遥控、遥调下发。

# 网关配置。后续增加网关时继续追加 gateway.2.*、gateway.3.*。
gateway.1.name = gateway1
gateway.1.host = 127.0.0.1
gateway.1.port = 2404
gateway.1.common_address = 1
gateway.1.enabled = true

# 示例：
# gateway.2.name = gateway2
# gateway.2.host = 192.168.1.11
# gateway.2.port = 2404
# gateway.2.common_address = 1
# gateway.2.enabled = true

# systemd 运行时建议保持 false，由 systemd 负责前台进程保护。
daemonize = false
# debug_level 可选：
# off    关闭普通打印，只输出 WARN/ERROR
# info   打印大致信息，输出 INFO/WARN/ERROR
# detail 打印详细信息，输出 DEBUG/INFO/WARN/ERROR
debug_level = info
pid_file = /run/iec104-master/iec104-master.pid
log_file = /var/log/iec104-master/iec104-master.log
debug_log_file = /var/log/iec104-master/debug/iec104-master-debug.log

connect_timeout_sec = 5
receive_timeout_sec = 2
reconnect_initial_sec = 2
reconnect_max_sec = 60
general_interrogation_interval_sec = 300
test_frame_interval_sec = 20
ack_timeout_ms = 15000
ack_window = 8

# 电表电量突发值识别：
# 1. 本次值和上次值的绝对差值 >= energy_spike_abs_threshold
# 2. 本次值相对上次值的倍率 >= energy_spike_rate_threshold，或反向骤降达到同等倍率
# 满足任一条件时输出 WARN 级别 ENERGY_SPIKE 日志。
energy_spike_abs_threshold = 1000.0
energy_spike_rate_threshold = 5.0

# 默认只记录遥信变化和遥测变化，避免长期运行时日志膨胀。
log_all_yc = false
log_unchanged_yx = false
